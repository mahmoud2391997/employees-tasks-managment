packages:
  - "apps/workforce"
  - "packages/workforce-database"

pmOnFail: ignore

minimumReleaseAgeExclude:
  - '@next/*'
  - next

allowBuilds:
  '@prisma/client': true
  '@prisma/engines': true
  esbuild: true
  prisma: true

overrides:
  deepmerge-ts: 8.0.0
  source-map-js: 1.2.2
  sharp: 0.35.5
  vite: 6.4.3
