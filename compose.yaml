services:
  postgres:
    image: postgres:16-alpine
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_DB: workforce
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - workforce_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d workforce"]
      interval: 2s
      timeout: 5s
      retries: 15
volumes:
  workforce_postgres:
